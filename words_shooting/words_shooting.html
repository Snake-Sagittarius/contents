<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>英単語穴埋めシューティング</title>
  <style>
    div, p {
      text-align: center;
    }
    table {
      margin: 0 auto;
    }
    td {
      vertical-align: top;
    }
    textarea {
      width: 200px;
      height: 200px;
    }
    #canvas1 {
      border: 2px solid gray;
    }
    button {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div>
  <h1>英単語穴埋めシューティング</h1>
    <table>
      <tr>
        <td><canvas id="canvas1" width="400" height="600"></canvas></td>
        <td>
          <h3>ヒント</h3>
          <textarea id="hint"></textarea>
          <h3>正解リスト</h3>
          <textarea id="correct"></textarea>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <button onclick="stop()">中断</button>
          <button onclick="start()">再開</button>
          <button onclick="disp()">単語データベース表示切替</button>
        </td>
      </tr>
    </table>  
  </div>
  <p><textarea id="wordlist"></textarea></p>
  <script>
    //英単語リスト初期設定
    const wordlist = document.getElementById("wordlist");
    wordlist.style.display = "none";
    wordlist.value = `apple|ˈæpl,りんご
baby|ˈbeɪbi,赤ちゃん
back|bæk,後ろ、背中
ball|bɔːl,ボール、球
bank|bæŋk,銀行、土手
base|beɪs,基礎、土台
bear|beər,クマ、耐える
bird|bɜːd,鳥
blue|bluː,青い
boat|bəʊt,ボート、小舟
book|bʊk,本、予約する
busy|ˈbɪzi,忙しい
cake|keɪk,ケーキ
call|kɔːl,呼ぶ、電話する
card|kɑːd,カード、トランプ
care|keər,世話、心配する
city|ˈsɪti,都市、市
cold|kəʊld,寒い、冷たい、風邪
cook|kʊk,料理する、料理人
cool|kuːl,涼しい、かっこいい
dark|dɑːk,暗い
date|deɪt,日付、デート
desk|desk,机
door|dɔːr,ドア、扉
draw|drɔː,描く、引く
easy|ˈiːzi,簡単な、容易な
face|feɪs,顔、直面する
fall|fɔːl,落ちる、秋
farm|fɑːm,農場
fast|fɑːst,早い、速く
find|faɪnd,見つける
fish|fɪʃ,魚、釣る
food|fuːd,食べ物、食品
free|friː,自由な、無料の
game|ɡeɪm,ゲーム、試合
girl|ɡɜːl,女の子
give|ɡɪv,与える
glad|ɡlæd,嬉しい
gold|ɡəʊld,金、黄金
good|ɡʊd,良い
hand|hænd,手、手渡す
hard|hɑːd,難しい、硬い、熱心に
head|hed,頭、率いる
hear|hɪər,聞こえる
help|help,助ける、手伝う
high|haɪ,高い
hill|hɪl,丘、小山
hold|həʊld,保持する、持つ
home|həʊm,家、家庭
hope|həʊp,希望する、望む
hour|ˈaʊər,時間（1時間）
house|haʊs,家、家屋
idea|aɪˈdɪə,考え、アイデア
join|dʒɔɪn,加わる、参加する
keep|kiːp,保つ、続ける
kind|kaɪnd,親切な、種類
king|kɪŋ,王、国王
know|nəʊ,知っている
land|lænd,土地、陸地、着陸する
late|leɪt,遅い、遅れて
lead|liːd,導く、リードする
leaf|liːf,葉
life|laɪf,命、生活、人生
light|laɪt,光、軽い、明るい
line|laɪn,線、列
lion|ˈlaɪən,ライオン
look|lʊk,見る
love|lʌv,愛、愛する
make|meɪk,作る
many|ˈmeni,多くの
map|mæp,地図
meet|miːt,会う
mind|maɪnd,心、気にする
moon|muːn,月
more|mɔːr,もっと多くの
name|neɪm,名前、名付ける
near|nɪər,近い、近くに
need|niːd,必要とする
new|njuː,新しい
nice|naɪs,素敵な、親切な
night|naɪt,夜
nose|nəʊz,鼻
note|nəʊt,メモ、書き留める
open|ˈəʊpən,開ける、開いている
page|peɪdʒ,ページ
park|pɑːk,公園、駐車する
part|pɑːt,部分、役
pass|pɑːs,通る、合格する、渡す
pay|peɪ,支払う
pen|pen,ペン
plan|plæn,計画、計画する
play|pleɪ,遊ぶ、演奏する、劇
rain|reɪn,雨、雨が降る
read|riːd,読む
rich|rɪtʃ,豊かな、金持ちの
ride|raɪd,乗る
ring|rɪŋ,指輪、鳴る
rise|raɪz,昇る、上がる
road|rəʊd,道路、道
rock|rɒk,岩、ロック音楽`;

    const canvas1 = document.getElementById("canvas1");
    const ctx1 = canvas1.getContext("2d");

    const player = { x: 200, y: 580 };
    let words = [];
    let hint = [];
    let bullets = [];
    let count = 10;

    getWords(words, hint, count);
    const hintlist = document.getElementById("hint");
    hintlist.value = hint.join("\n");
    const correctlist = document.getElementById("correct");

    let isGameOver = false;

    let animationId; // intervalIdの代わり
    let lastTime = performance.now(); // 前回フレームの時間を記録

    // 初回のゲームループ呼び出し
    animationId = requestAnimationFrame(gameLoop);

    function gameLoop(timestamp) {
      if (isGameOver) return; // 中断中は処理しない

      // 前回のフレームからの経過時間(秒)を計算
      const deltaTime = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      let i = 0;
      let j = 0;

      //画面をクリア
      ctx1.clearRect(0, 0, 400, 600);
      
      ctx1.fillStyle = "black";
      ctx1.font = "20px monospace";
      for(i = 0; i < count; i++){
        if(words[i].f){          
          //描画(ターゲット)  
          ctx1.fillRect(words[i].x - 25, words[i].y - 1, 50, 2);
          
          //描画(単語)          
          ctx1.fillText(words[i].q, words[i].x - 25, words[i].y - 2);

          // 落下移動（経過時間に合わせて移動させる：1秒間に40ピクセル）
          if(words[i].y < 600){
            words[i].y += 40 * deltaTime; 
          }else{
            words[i].f = false;
          }
        }
      }
      
      //描画(プレーヤ)
      ctx1.fillStyle = "blue";
      ctx1.fillRect(player.x - 15, player.y - 5, 30, 10);

      //描画(弾丸)    
      ctx1.fillStyle = "black";
      for(i = 0; i < bullets.length; i++){
        if(bullets[i].f){
          ctx1.fillText(bullets[i].c, bullets[i].x, bullets[i].y);

          // 当たり判定
          for(j = count - 1; j >= 0; j--){
            if(words[j].f){
              if(bullets[i].y <= words[j].y){
                if(bullets[i].x >= words[j].x - 25 && bullets[i].x <= words[j].x + 25){
                  if(bullets[i].c == words[j].a){
                    bullets[i].f = false;
                    words[j].f = false;
                    correctlist.value += (words[j].c + "\n");
                  }
                }
              }else{
                break;
              }
            }
          }

          // 弾丸移動（経過時間に合わせて移動させる：1秒間に60ピクセル）
          if(bullets[i].y > -50){
            bullets[i].y -= 60 * deltaTime;
          }else{
            bullets[i].f = false;
          }
        }
      }

      // 次のフレームを描画するタイミングで再度gameLoopを呼び出す
      animationId = requestAnimationFrame(gameLoop);
    }

    //⑤プレーヤコントロール
    canvas1.addEventListener("mousemove", function (e) {
      if (isGameOver) return;
      const rect = e.target.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    //弾丸を追加
    window.addEventListener('keydown', function (e) {
      if (isGameOver) return;

      //テキストエリア（textarea）にフォーカスがある時は、ゲームのキー入力を無視する
      if (document.activeElement.tagName === "TEXTAREA") {
        return;
      }
      const key = e.key;  //押されたキーの文字を取得

      // 1文字のアルファベット（半角の a-z または A-Z）のみを判定する正規表現
      if (/^[a-zA-Z]$/.test(key)) {
        bullets.push({ x: player.x, y: player.y, c: key.toLowerCase(), f: true});
      }
    });

    // //ゲーム中断
    function stop(){
      cancelAnimationFrame(animationId); // アニメーションをキャンセル
      isGameOver = true;
    }

    //ゲーム再開
    function start(){
      if (!isGameOver) return; // すでに動いている場合は何もしない
      isGameOver = false;
      lastTime = performance.now(); // 再開した時点の時間をセットして時間のズレを防ぐ
      animationId = requestAnimationFrame(gameLoop);
    }

    //英単語リストを表示して正解を検索できる
    function disp(){
      const wordlist = document.getElementById("wordlist");
      if(wordlist.style.display == "none"){
        wordlist.style.display = "block";
        wordlist.style.margin = "0 auto";
      }else{
        wordlist.style.display = "none";
      }      
    }

    //英単語リストからランダムでcountの数だけ抽出
    function getWords(words, hint, count){
      const wordlist = document.getElementById("wordlist");
      const data = wordlist.value.split("\n");
      const len = data.length;
      let i = 0;
      let j = 0;
      let k = 0;
      let tmp = "";
      let buf = [];

      for(i = len - 1; i >= len - count; i--){
        j = Math.floor(Math.random() * (i + 1));
        tmp = data[i];
        data[i] = data[j];
        data[j] = tmp;
      }
      const list = data.slice(-count);

      for(i = 0; i < count; i++){
        buf = list[i].split("|");
        hint.push(buf[1]);

        j = Math.floor(Math.random() * 300 + 50);
        let char = [...buf[0]];
        k = Math.floor(Math.random() * char.length);
        let ans = char[k];
        char[k] = "□";
        words.push({ x: j, y: -950 + 100 * i, c: buf[0], q: char.join(""), a: ans, f: true});
      }
    }
  </script>
</body>
</html>
